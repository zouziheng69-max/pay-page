<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#231012">
<title>订单管理 · RIPPLE</title>
<style>
:root{color-scheme:dark;--bg:#231012;--panel:rgba(255,236,230,.075);--line:rgba(255,220,210,.16);--paper:#f5efe9;--mute:#c9aea8;--neon:#ff3b2f;--ok:#07c160;--wx:#07c160;--ali:#1677ff;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--paper);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 30% at 100% 0%,rgba(255,59,47,.22),transparent 70%),linear-gradient(180deg,#2c1214,#231012 60%)}
button,input,select{font:inherit;color:inherit}
main{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:22px}
h1 b{color:var(--neon)}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.1);white-space:nowrap}
.btn.red{background:var(--neon);color:#fff}
.btn.green{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
/* 登录 */
.login{max-width:360px;margin:12vh auto 0;padding:24px;text-align:center}
.login input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);padding:0 14px;margin:14px 0 10px;font-size:16px;outline:none}
.login input:focus{border-color:var(--neon)}
.login label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:13px;margin-bottom:12px}
.login .btn{width:100%;height:46px}
.err{color:#ff9e94;font-size:13px;min-height:20px;margin-top:8px}
/* 顶部 */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--mute);font-size:12px}
.stat.warn b{color:#ffd27a}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--mute);white-space:nowrap}
.tab[aria-pressed=true]{background:var(--neon);border-color:var(--neon);color:#fff;font-weight:700}
.tab i{font-style:normal;opacity:.8;margin-left:3px}
.search{flex:1 1 100%;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);padding:0 12px;outline:none;font-size:16px}
.search:focus{border-color:var(--neon)}
/* 订单列表 */
.list{margin-top:12px;display:grid;gap:10px}
.o{padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.o .code{font:700 24px/1 ui-monospace,Menlo,monospace;letter-spacing:2px}
.o .who{min-width:0}
.o .who b{font-size:16px}
.o .cls{font-size:12.5px;font-weight:700;color:#ffd9d2;background:rgba(255,59,47,.16);border:1px solid rgba(255,110,90,.3);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.o .who .sub{overflow-wrap:anywhere}
.o .money{text-align:right}
.o .money b{font-size:18px}
.o .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}
.o .ops{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.pending{background:rgba(255,190,60,.18);color:#ffd27a}
.pill.claimed{background:rgba(110,160,255,.2);color:#a9c6ff}
.pill.confirmed{background:rgba(7,193,96,.2);color:#6be3a1}
.pill.in{background:rgba(255,255,255,.14);color:#fff}
.pill.void{background:rgba(255,255,255,.08);color:#9c8a86}
.pill.wx{background:rgba(7,193,96,.14);color:#6be3a1}
.pill.ali{background:rgba(22,119,255,.18);color:#8db8ff}
.pill.free{background:rgba(255,190,90,.16);color:#ffd27a}
.o.void{opacity:.55}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.help{margin-top:16px;padding:12px 14px;font-size:13px;color:var(--mute)}
.help b{color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,4,5,.95);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <section class="card login" id="loginBox">
    <h1><b>RIPPLE</b> 订单管理</h1>
    <div class="sub">仅主办方使用</div>
    <input id="key" type="password" placeholder="管理密码" autocomplete="current-password">
    <label><input type="checkbox" id="remember" style="width:auto;height:auto;margin:0"> 在这台设备上记住密码</label>
    <button class="btn red" id="loginBtn">进入</button>
    <div class="err" id="loginErr"></div>
  </section>

  <section id="app" hidden>
    <div class="top">
      <div><h1><b>RIPPLE</b> 订单管理</h1><div class="sub" id="updated"></div></div>
      <div class="acts">
        <button class="btn" id="reload">刷新</button>
        <button class="btn ghost" id="export">导出表格</button>
        <button class="btn ghost" id="demoReset" hidden>清空预览数据</button>
        <button class="btn ghost" id="purge" style="color:#ff8b7e;border-color:rgba(255,110,90,.45)">清空所有记录</button>
        <button class="btn ghost" id="logout">退出</button>
      </div>
    </div>
    <div class="stats">
      <div class="card stat warn"><b id="sPending">0</b><span>待确认订单</span></div>
      <div class="card stat"><b id="sTickets">0</b><span>已确认票数</span></div>
      <div class="card stat"><b id="sIn">0</b><span>已入场人数</span></div>
      <div class="card stat"><b id="sMoney">¥0</b><span>已确认收款</span></div>
    </div>
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="q" type="search" placeholder="搜订单号 / 姓名 / 班级 / 手机号">
    </div>
    <div class="list" id="list"></div>
    <div class="card help">
      <b>怎么核对：</b>打开微信或支付宝的收款记录，看每笔钱的<b>备注里的订单号</b>和<b>金额</b>，对上了就点「确认收款」，买家的页面会自动出票。<br>
      <b>入场时：</b>请观众出示电子票，在上面搜票上的订单号，点「核验入场」。同一张票第二次核验会提示已入场。
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="cloudbase.min.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = (t) => t ? new Date(t).toLocaleString('zh-CN', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const KEY_STORE = 'tedx-admin-key';
let KEY = '', orders = [], filter = 'pending', timer = 0, loading = false;

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
const store = { get() { try { return sessionStorage.getItem(KEY_STORE) || localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } },
  set(k, remember) { try { sessionStorage.setItem(KEY_STORE, k); if (remember) localStorage.setItem(KEY_STORE, k); } catch (e) {} },
  clear() { try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch (e) {} } };

const api = (data) => window.tedxApi({ action: 'admin', key: KEY, ...data });

// 订单在列表里属于哪一类
function kind(o) {
  if (o.status === 'void') return 'void';
  if (o.status === 'confirmed') return o.checkedInAt ? 'in' : 'confirmed';
  return 'pending';
}
const TABS = [['pending', '待确认'], ['confirmed', '已确认'], ['in', '已入场'], ['void', '已作废'], ['all', '全部']];

async function login() {
  const k = $('key').value.trim();
  if (!k) { $('loginErr').textContent = '请输入管理密码'; return; }
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  KEY = k;
  try {
    await api({ op: 'login' });
    store.set(k, $('remember').checked);
    enter();
  } catch (e) { $('loginErr').textContent = e.message; KEY = ''; }
  $('loginBtn').disabled = false;
}
function enter() {
  $('loginBox').hidden = true; $('app').hidden = false;
  load();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load(true); }, 20000);
}
async function load(silent) {
  if (loading) return;
  loading = true;
  if (!silent) $('reload').innerHTML = '<span class="spin"></span>';
  try {
    const r = await api({ op: 'list' });
    orders = r.orders;
    $('updated').textContent = `共 ${orders.length} 个订单 · 更新于 ${new Date().toLocaleTimeString('zh-CN', { hour12: false })}`;
    render();
  } catch (e) {
    if (e.code === 'BAD_KEY') { logout(); $('loginErr').textContent = '管理密码已变更，请重新输入'; }
    else if (!silent) toast(e.message);
  }
  $('reload').textContent = '刷新';
  loading = false;
}
function render() {
  const cnt = { all: orders.length, pending: 0, confirmed: 0, in: 0, void: 0 };
  let tickets = 0, inPeople = 0, money = 0;
  for (const o of orders) {
    cnt[kind(o)]++;
    if (o.status === 'confirmed') { tickets += o.qty; money += o.amount; if (o.checkedInAt) inPeople += o.qty; }
  }
  $('sPending').textContent = cnt.pending; $('sTickets').textContent = tickets; $('sIn').textContent = inPeople;
  $('sMoney').textContent = '¥' + Math.round(money * 100) / 100;
  $('tabs').innerHTML = TABS.map(([k, n]) => `<button class="tab" data-k="${k}" aria-pressed="${k === filter}">${n}<i>${cnt[k]}</i></button>`).join('');
  const kw = $('q').value.trim().toUpperCase();
  const shown = orders.filter((o) => (kw ? [o.code, o.name.toUpperCase(), o.phone, (o.cls || '').toUpperCase()].some((v) => v.includes(kw)) : filter === 'all' || kind(o) === filter));
  // 待确认里，买家已点「我已完成付款」的排前面
  if (filter === 'pending' && !kw) shown.sort((a, b) => (!!b.claimedAt - !!a.claimedAt) || (b.createdAt - a.createdAt));
  $('list').innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty">${kw ? '没有找到匹配的订单' : '这里还没有订单'}</div>`;
}
function card(o) {
  const k = kind(o);
  const status = { pending: o.claimedAt ? '<span class="pill claimed">买家已点付款</span>' : '<span class="pill pending">未付款/待确认</span>',
    confirmed: '<span class="pill confirmed">已确认</span>', in: '<span class="pill in">已入场</span>', void: '<span class="pill void">已作废</span>' }[k];
  const m = o.method === 'free' ? '<span class="pill free">免费预约</span>' : o.method === 'alipay' ? '<span class="pill ali">支付宝</span>' : '<span class="pill wx">微信</span>';
  let ops = {
    pending: `<button class="btn green" data-op="confirm">确认收款</button><button class="btn ghost" data-op="void">作废</button>`,
    confirmed: `<button class="btn red" data-op="checkin">核验入场</button><button class="btn ghost" data-op="unconfirm">撤回为待确认</button>`,
    in: `<button class="btn ghost" data-op="uncheckin">撤销入场</button>`,
    void: `<button class="btn ghost" data-op="restore">恢复为待确认</button>`,
  }[k];
  const free = o.method === 'free';
  // 免费预约没有「待确认」这一步：撤回改成作废，恢复直接回到已确认
  if (free && k === 'confirmed') ops = `<button class="btn red" data-op="checkin">核验入场</button><button class="btn ghost" data-op="void">作废</button>`;
  if (free && k === 'void') ops = `<button class="btn ghost" data-op="reconfirm">恢复预约</button>`;
  return `<div class="card o ${k}" data-id="${esc(o.id)}">
    <div class="code">${esc(o.code)}</div>
    <div class="who"><b>${esc(o.name)}</b>${o.cls ? ` <span class="cls">${esc(o.cls)}</span>` : ''}<div class="sub">${[o.phone, `${o.ticketName} × ${o.qty}`].filter(Boolean).map(esc).join(' · ')}</div></div>
    <div class="money"><b>¥${o.amount}</b></div>
    <div class="meta">${status}${m}<span>${free ? '预约' : '下单'} ${fmt(o.createdAt)}</span>${o.claimedAt ? `<span>· 点付款 ${fmt(o.claimedAt)}</span>` : ''}${o.confirmedAt ? `<span>· 确认 ${fmt(o.confirmedAt)}</span>` : ''}${o.checkedInAt ? `<span>· 入场 ${fmt(o.checkedInAt)}</span>` : ''}</div>
    <div class="ops">${ops}</div>
  </div>`;
}
async function act(id, op, btn) {
  const o = orders.find((x) => x.id === id);
  const ask = { void: `确定作废订单 ${o.code}（${o.name}）？`, unconfirm: `把 ${o.code} 撤回为待确认？买家的电子票会失效。`,
    uncheckin: `撤销 ${o.code} 的入场记录？`, restore: `把 ${o.code} 恢复为待确认？` }[op];
  if (ask && !confirm(ask)) return;
  const req = { confirm: { op: 'set', status: 'confirmed' }, void: { op: 'set', status: 'void' }, unconfirm: { op: 'set', status: 'pending' },
    restore: { op: 'set', status: 'pending' }, reconfirm: { op: 'set', status: 'confirmed' }, checkin: { op: 'checkin' }, uncheckin: { op: 'checkin', undo: true } }[op];
  btn.disabled = true;
  try {
    const r = await api({ ...req, id });
    Object.assign(o, r.order);
    toast({ confirm: `已确认 ${o.code}，买家页面会自动出票`, void: `已作废 ${o.code}`, checkin: `✓ ${o.code} ${o.name} 核验通过，${o.qty} 人入场`,
      unconfirm: `已撤回 ${o.code}`, uncheckin: `已撤销 ${o.code} 的入场`, restore: `已恢复 ${o.code}`, reconfirm: `已恢复 ${o.code} 的预约` }[op]);
    render();
  } catch (e) { toast(e.message); btn.disabled = false; if (e.code === 'ALREADY_IN') load(true); }
}
function exportCsv() {
  const ST = { pending: '待确认', confirmed: '已确认', void: '已作废' };
  const head = ['订单号', '姓名', '班级', '手机号', '票种', '张数', '金额', '付款方式', '状态', '买家点付款', '下单时间', '确认时间', '入场时间'];
  const rows = orders.map((o) => [o.code, o.name, o.cls || '', o.phone, o.ticketName, o.qty, o.amount, o.method === 'free' ? '免费预约' : o.method === 'alipay' ? '支付宝' : '微信',
    ST[o.status] || o.status, o.claimedAt ? '是' : '', fmt(o.createdAt), fmt(o.confirmedAt), fmt(o.checkedInAt)]);
  const csv = '﻿' + [head, ...rows].map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `RIPPLE订单_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function logout() { store.clear(); KEY = ''; clearInterval(timer); $('app').hidden = true; $('loginBox').hidden = false; $('key').value = ''; }

$('loginBtn').onclick = login;
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('reload').onclick = () => load();
$('logout').onclick = logout;
$('export').onclick = exportCsv;
// 清空所有订单（测试数据）：要再输一次清空密码，服务器核对
$('purge').onclick = async () => {
  const pk = prompt('清空后所有订单都会被永久删除，无法恢复。\n建议先点「导出表格」备份。\n\n请输入清空密码：');
  if (pk === null) return;
  if (!pk.trim()) return toast('没有输入清空密码');
  if (!confirm(`确定要删除全部 ${orders.length} 条订单记录吗？`)) return;
  const b = $('purge'); b.disabled = true;
  try {
    const r = await api({ op: 'purge', purgeKey: pk.trim() });
    toast(`已清空 ${r.deleted} 条记录`);
    load();
  } catch (e) { toast(e.message); }
  b.disabled = false;
};
if (window.TEDX_DEMO) {
  $('demoReset').hidden = false;
  $('demoReset').onclick = () => { if (confirm('清空这台设备上的所有预览订单？')) { window.tedxDemo.reset(); load(); } };
}
$('tabs').onclick = (e) => { const b = e.target.closest('[data-k]'); if (!b) return; filter = b.dataset.k; $('q').value = ''; render(); };
$('q').addEventListener('input', render);
$('list').onclick = (e) => { const b = e.target.closest('[data-op]'); if (!b) return; act(b.closest('[data-id]').dataset.id, b.dataset.op, b); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY) load(true); });

addEventListener('DOMContentLoaded', () => {
  const saved = store.get();
  if (!saved) { $('key').focus(); return; }
  KEY = saved;
  (function wait() { if (!window.cloudbase && !window.TEDX_DEMO && !window.TEDX_CONFIG.apiUrl) return setTimeout(wait, 200); enter(); })();
});
</script>
</body>
</html>
